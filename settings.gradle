pluginManagement {
	resolutionStrategy {
		eachPlugin {
			if (requested.id.id == 'fabric-loom') {
				useModule("net.fabricmc:fabric-loom:${requested.version}")
			}
		}
	}

	repositories {
		maven { url = 'https://maven.neoforged.net/releases' }
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'day-counter'
