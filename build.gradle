plugins {
	id 'java'
	id 'maven-publish'
	id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = mod_group_id

base {
	archivesName = "day-counter-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir('run')
		}
		register('client')
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
	// TabbyLib from the local maven repository (run "gradlew publishToMavenLocal" in the TabbyLib project)
	mavenLocal()
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
	implementation "me.avie29.tabbylib:tabbylib-forge:${tabbylib_version}"
	annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.withType(ProcessResources).configureEach {
	def replaceProperties = [
		minecraft_version_range: minecraft_version_range,
		forge_version_range: forge_version_range,
		mod_id: mod_id,
		mod_version: mod_version
	]
	inputs.properties(replaceProperties)
	filesMatching('META-INF/mods.toml') {
		expand(replaceProperties)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
}
