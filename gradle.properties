# Done to increase the memory available to gradle (Loom and NeoForm both set up Minecraft).
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Mod Properties
version=2.0.0
group=cc.avie.daycounter
# Fabric allows "-" in mod ids, NeoForge only "_". Assets and translations keep using mod_id.
mod_id=day-counter
neoforge_mod_id=day_counter
mod_name=Day Counter
mod_description=Displays the current Minecraft day in a configurable HUD.
mod_author=Avie
mod_license=Avie Terms & Conditions 1.0
java_version=25

minecraft_version=26.3

# Fabric
# check these on https://fabricmc.net/develop
fabric_loader_version=0.20.1
loom_version=1.19.4
fabric_api_version=0.166.0+26.3

# NeoForge
# check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.102
neo_form_version=26.3-1
moddev_version=2.0.148

# Dependencies
tabbylib_version=2.0.1
modmenu_version=21.0.0
